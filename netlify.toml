[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Security headers (mirrors public/_headers for Netlify deploys).
# NOTE: when you enable GTM/GA/Clarity/Meta/LinkedIn in BaseLayout.astro,
# add their hosts to script-src/connect-src/frame-src below and remove
# Cross-Origin-Embedder-Policy (third-party analytics scripts are not CORP-compliant).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = """
default-src 'self'; \
script-src 'self'; \
style-src 'self' 'unsafe-inline'; \
font-src 'self' data:; \
img-src 'self' data: https:; \
connect-src 'self'; \
object-src 'none'; \
frame-ancestors 'none'; \
base-uri 'self'; \
form-action 'self' https://wa.me; \
upgrade-insecure-requests"""
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
